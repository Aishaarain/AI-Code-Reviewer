[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-code-reviewer"
version = "0.1.0"
description = "Multi-agent GitHub pull request reviewer built with LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-groq>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["reviewer*"]

[tool.setuptools.package-data]
reviewer = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
